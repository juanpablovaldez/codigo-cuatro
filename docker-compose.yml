version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tfi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tfi_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tfi_gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - CATALOG_SERVICE_HOST=catalog-service
      - CATALOG_SERVICE_PORT=3003
      - ORDER_SERVICE_HOST=order-service
      - ORDER_SERVICE_PORT=3005
    depends_on:
      - catalog-service
      - order-service
    networks:
      - tfi_network

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: tfi_catalog_service
    expose:
      - "3003"
    environment:
      - PORT=3003
    networks:
      - tfi_network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: tfi_order_service
    expose:
      - "3005"
    environment:
      - PORT=3005
    networks:
      - tfi_network

networks:
  tfi_network:
    driver: bridge
