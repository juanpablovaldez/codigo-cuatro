version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tfi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tfi_network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tfi_api_gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3004
      - ORDER_SERVICE_URL=http://order-service:3005
    depends_on:
      - auth-service
      - inventory-service
      - order-service
    networks:
      - tfi_network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tfi_auth_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    depends_on:
      - rabbitmq
    networks:
      - tfi_network

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: tfi_inventory_service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
    depends_on:
      - rabbitmq
    networks:
      - tfi_network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: tfi_order_service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
    depends_on:
      - rabbitmq
    networks:
      - tfi_network

networks:
  tfi_network:
    driver: bridge
