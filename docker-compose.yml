version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tfi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tfi_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tfi_gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - PRODUCTS_SERVICE_HOST=products-service
      - PRODUCTS_SERVICE_PORT=3003
      - ORDERS_SERVICE_HOST=orders-service
      - ORDERS_SERVICE_PORT=3005
    depends_on:
      - products-service
      - orders-service
    networks:
      - tfi_network

  products-service:
    build:
      context: ./services/products
      dockerfile: Dockerfile
    container_name: tfi_products_service
    expose:
      - "3003"
    environment:
      - PORT=3003
    networks:
      - tfi_network

  orders-service:
    build:
      context: ./services/orders
      dockerfile: Dockerfile
    container_name: tfi_orders_service
    expose:
      - "3005"
    environment:
      - PORT=3005
    networks:
      - tfi_network

networks:
  tfi_network:
    driver: bridge
